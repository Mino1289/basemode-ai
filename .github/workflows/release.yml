name: Release

# A tag push starts this, and the tag comes from `scripts/release.sh X.Y.Z --tag`.
# main is protected, so the release commit reaches it through a PR: `--push` opens
# that PR from release/vX.Y.Z, and `--tag` tags the PR's merge commit only once it
# merged with every check green. Never tag by hand.
#
# Every job has timeout-minutes (30 for the build, 15 for the rest; the longest leg
# of v0.15.2, the Windows build, took 6m16s), so a hang fails the job instead of
# running for GitHub's six hours. `scripts/ci_guards.py timeouts` checks every
# workflow file for it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The base-help coach is fetched from this tag by every `base update`, so a
  # tag whose coach lags the binary ships stale documentation to every machine.
  # src/help_docs.rs holds the coach to the CLI; refuse to build if it fails.
  docs-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: base-help coach matches this binary
        run: cargo test --bin base help_docs
      # `base update` verifies a release against the key compiled into the
      # binary. A tag cut while that key is still the keygen placeholder ships
      # binaries that cannot verify anything, and an update that cannot verify
      # is refused — so the release would reach nobody. Fail here instead, where
      # the message says what to run.
      - name: release-key.pub is a real key
        run: |
          if grep -q '^UNSET' release-key.pub; then
            echo "::error::release-key.pub is still the keygen placeholder. Run scripts/release-sign.sh keygen, commit release-key.pub, and set MINISIGN_SECRET_KEY before tagging."
            exit 1
          fi

  build:
    needs: docs-gate
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: base-linux-x86_64.tar.gz
            binary: base
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: base-windows-x86_64.zip
            binary: base.exe
          - target: aarch64-apple-darwin
            os: macos-14
            asset: base-darwin-aarch64.tar.gz
            binary: base
          # Intel Macs. Without this there is no macOS download at all for anyone
          # on pre-2020 hardware — not a broken install, simply nothing to install.
          # Cross-compiled from the ARM runner; macos-14 ships both toolchains.
          - target: x86_64-apple-darwin
            os: macos-14
            asset: base-darwin-x86_64.tar.gz
            binary: base

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging/scripts/ast
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} staging/
          strip staging/${{ matrix.binary }} || true
          cp scripts/ast/*.py staging/scripts/ast/
          cp scripts/ast/requirements.txt staging/scripts/ast/
          # FSL-1.1-ALv2 asks that copies carry the terms, and this asset is
          # the first copy anyone receives.
          cp LICENSE.md LICENSING.md LICENSE-APACHE-2.0 staging/
          cd staging
          # `tar` packs the members it is named, so the licenses belong on
          # this line as well as in the `cp` above. Adding a file to staging/
          # alone leaves it out of the archive.
          tar -czf ../${{ matrix.asset }} ${{ matrix.binary }} scripts/ LICENSE.md LICENSING.md LICENSE-APACHE-2.0

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/scripts/ast | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} staging/
          Copy-Item scripts/ast/*.py staging/scripts/ast/
          Copy-Item scripts/ast/requirements.txt staging/scripts/ast/
          # Same three files as the Unix leg. `Compress-Archive -Path staging/*`
          # globs, so unlike `tar` it needs no member list of its own.
          Copy-Item LICENSE.md,LICENSING.md,LICENSE-APACHE-2.0 staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      # `download-artifact` leaves each archive inside a directory named after
      # it. Flatten into one directory so the checksum file, the signature and
      # the release upload all name the same paths.
      - name: Collect assets
        run: |
          mkdir -p dist
          for a in base-linux-x86_64.tar.gz base-windows-x86_64.zip \
                   base-darwin-aarch64.tar.gz base-darwin-x86_64.tar.gz; do
            cp "$a/$a" "dist/$a"
          done

      # Every release body but three was this install template and nothing else,
      # so the tag was the only record of what changed. CHANGELOG.md now carries
      # that record, and `cargo test` refuses a version that has no section, so
      # this step cannot find nothing.
      - name: Release notes for this tag
        run: |
          python3 scripts/changelog.py extract "${GITHUB_REF_NAME#v}" > release-notes.md
          cat >> release-notes.md <<'FOOTER'

          ---
          ## Verify

          `SHA256SUMS` is signed with the release key in `release-key.pub`:

          ```bash
          minisign -V -m SHA256SUMS -x SHA256SUMS.minisig -p release-key.pub
          sha256sum -c SHA256SUMS
          ```

          ## Install

          ```bash
          npx chrisai
          ```

          Or download the binary for your platform below.

          Docs: https://docs.basemode.ai
          FOOTER

      # Without a signature the release is a DRAFT, not a published one:
      # /releases/latest ignores drafts, so no installed base can ever be handed
      # a binary it would refuse to install. The alternative — publishing
      # unsigned and hoping — is the hole this whole phase exists to close.
      - name: Checksums and signature
        id: sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          cd dist
          sha256sum base-* > SHA256SUMS
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MINISIGN_SECRET_KEY is not set, so this release is a DRAFT and cannot be installed. Sign it and publish: scripts/release-sign.sh sign <dir>, then upload SHA256SUMS and SHA256SUMS.minisig."
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign

          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          chmod 600 "$key"

          # Prove the secret is the pair of the key the binary trusts. A
          # mismatch publishes releases that every installed base refuses, and
          # nothing else in this job would notice.
          printf 'release key probe\n' > "$RUNNER_TEMP/probe"
          minisign -S -s "$key" -m "$RUNNER_TEMP/probe" -x "$RUNNER_TEMP/probe.minisig"
          minisign -V -m "$RUNNER_TEMP/probe" -x "$RUNNER_TEMP/probe.minisig" \
            -p "$GITHUB_WORKSPACE/release-key.pub" >/dev/null

          minisign -S -s "$key" -m SHA256SUMS -x SHA256SUMS.minisig
          rm -f "$key" "$RUNNER_TEMP/probe" "$RUNNER_TEMP/probe.minisig"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ steps.sign.outputs.signed != 'true' }}
          fail_on_unmatched_files: true
          files: dist/*
          body_path: release-notes.md

  # Tell the docs site a release happened. It fetches the coach's reference files
  # and this changelog at the tag and opens its own pull request; nothing is
  # pushed from here. Skipped rather than failed when the token is absent, so a
  # release never fails on the docs half.
  #
  # A draft release is not a release: it is not installable, so the docs site
  # must not describe it as current.
  notify-docs:
    needs: release
    if: needs.release.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch to basemode-docs
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          # Tested in the shell rather than in an `if:` expression: the secrets
          # context is not available to step conditions, and a skip that says why
          # in the log beats one that silently evaluates to false.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "DOCS_DISPATCH_TOKEN is not set on this repository; the docs site will"
            echo "pick this release up on its hourly poll instead. Skipping."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ChristopherKahler/basemode-docs/dispatches \
            -d "{\"event_type\":\"base-release\",\"client_payload\":{\"tag\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\"}}"
